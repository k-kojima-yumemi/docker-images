name: postgres-health-check
on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/postgres-health-check.yaml'
      - 'postgres-health-check/**'
  pull_request:
    paths:
      - '.github/workflows/postgres-health-check.yaml'
      - 'postgres-health-check/**'

env:
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: 'postgres-health-check/ts'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - run: docker compose -f compose.yaml -f compose.ci.yaml up -d database
      - run: docker compose -f compose.yaml -f compose.ci.yaml run --rm app npm ci
      - run: docker compose -f compose.yaml -f compose.ci.yaml run --rm app npm run ci
      - run: docker compose -f compose.yaml -f compose.ci.yaml run --rm app npm run build
      - name: Run test
        run: docker compose -f compose.yaml -f compose.ci.yaml run --rm app npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log into registry ghcr.io
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/k-kojima-yumemi/postgres-health-check:latest
          platforms: linux/amd64,linux/arm64
          context: 'postgres-health-check/ts'
          file: 'postgres-health-check/ts/Dockerfile'

  renovate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    needs:
      - test
      - build
    if: ${{ cancelled() || failure() }}
    steps:
      - run: 'false'
