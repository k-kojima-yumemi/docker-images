name: postgres-health-check
on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/postgres-health-check.yaml'
      - 'postgres-health-check/**'
  pull_request:
    paths:
      - '.github/workflows/postgres-health-check.yaml'
      - 'postgres-health-check/**'

env:
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: 'postgres-health-check/ts'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - run: docker compose -f compose.yaml -f compose.ci.yaml up -d database
      - run: docker compose -f compose.yaml -f compose.ci.yaml run --rm app npm ci
      - run: docker compose -f compose.yaml -f compose.ci.yaml run --rm app npm run ci
      - run: docker compose -f compose.yaml -f compose.ci.yaml run --rm app npm run build
      - name: Run test
        run: docker compose -f compose.yaml -f compose.ci.yaml run --rm app npm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Mask IAM role unique ID
        run: echo "::add-mask::${{ secrets.ECR_LOGIN_IAM_ROLE_ID }}"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.ECR_LOGIN_IAM_ROLE }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Log into registry public.ecr.aws
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registry-type: public
      - name: Log into registry ghcr.io
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/k-kojima-yumemi/postgres-health-check:latest
          platforms: linux/amd64,linux/arm64
          context: 'postgres-health-check/ts'
          file: 'postgres-health-check/ts/Dockerfile'

  renovate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    needs:
      - test
      - build
    if: ${{ cancelled() || failure() }}
    steps:
      - run: 'false'
