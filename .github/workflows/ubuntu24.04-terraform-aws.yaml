name: 'ubuntu24.04-terraform-aws'

on:
  push:
    branches:
      - main
    paths: 
      - '.github/workflows/ubuntu24.04-terraform-aws.yaml'
      - 'ubuntu24.04-terraform-aws/**'
  schedule:
    - cron: '22 16 */10 * *'

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: ghcr.io/k-kojima-yumemi/ubuntu24.04-terraform-aws:latest
          platforms: linux/amd64,linux/arm64
          context: 'ubuntu24.04-terraform-aws'
          file: 'ubuntu24.04-terraform-aws/Dockerfile'
