name: 'ubuntu24.04-terraform-aws'

on:
  push:
    branches:
      - main
    paths: 
      - '.github/workflows/ubuntu24.04-terraform-aws.yaml'
      - 'ubuntu24.04-terraform-aws/**'
  schedule:
    - cron: '22 16 */10 * *'

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          push: true
          tags: ghcr.io/k-kojima-yumemi/ubuntu24.04-terraform-aws:latest
          platforms: linux/amd64,linux/arm64
          context: 'ubuntu24.04-terraform-aws'
          file: 'ubuntu24.04-terraform-aws/Dockerfile'
